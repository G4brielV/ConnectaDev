services:
  postgres:
    image: postgres:16-alpine
    container_name: connectadev-db
    restart: always
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: trilhatech_db
    ports:
      - "5433:5432"
    volumes:
      - connectadev_pgdata:/var/lib/postgresql/data

volumes:
  connectadev_pgdata:
